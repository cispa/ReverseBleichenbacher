<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Information</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            color: #667eea;
            font-size: 3em;
            text-align: center;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }
        
        .info-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .info-section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .info-item {
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .info-label {
            font-weight: 600;
            color: #555;
        }
        
        .info-value {
            color: #333;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            text-align: right;
        }
        
        .icon {
            font-size: 1.2em;
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }
            
            .info-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }
            
            .info-value {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✅ Better Bleichenbacher MITM Attack Successful</h1>
        
        <div class="info-section">
            <h2><span class="icon">🌐</span> Domain Information</h2>
            <div class="info-item">
                <span class="info-label">Hostname:</span>
                <span class="info-value" id="hostname">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">Protocol:</span>
                <span class="info-value" id="protocol">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">Port:</span>
                <span class="info-value" id="port">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">Full URL:</span>
                <span class="info-value" id="fullUrl">-</span>
            </div>
        </div>
    </div>
    
    <script>
        // Domain Information
        document.getElementById('hostname').textContent = window.location.hostname;
        document.getElementById('protocol').textContent = window.location.protocol;
        document.getElementById('port').textContent = window.location.port || (window.location.protocol === 'https:' ? '443' : '80');
        document.getElementById('fullUrl').textContent = window.location.href;
    </script>
</body>
</html>
